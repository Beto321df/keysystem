<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Z NEXUS — Secure Key Gateway</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{font-family:'Plus Jakarta Sans',sans-serif;background:#050508;-webkit-user-select:none;user-select:none}
.card{background:linear-gradient(145deg,rgba(23,23,36,.96),rgba(10,10,17,.96));border:1px solid #292941;box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}
.btn{transition:transform .18s ease,box-shadow .18s ease,background .18s ease}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(99,102,241,.28)}.btn:active{transform:scale(.98)}
.dur{transition:all .18s ease}.dur:hover{transform:translateY(-2px);border-color:#6366f1;background:rgba(99,102,241,.12)}
.dur.active{border-color:#818cf8;background:rgba(99,102,241,.16);box-shadow:0 0 0 1px rgba(129,140,248,.25),0 12px 30px rgba(79,70,229,.18)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.in{animation:in .28s ease both}
@keyframes pulseLine{0%,100%{opacity:.3}50%{opacity:1}}.pulse-line{animation:pulseLine 2s ease-in-out infinite}
</style>
<script>document.addEventListener('contextmenu',e=>e.preventDefault(),false)</script>
</head>
<body class="min-h-screen text-white flex items-center justify-center px-4 py-8">
<div class="fixed inset-0 pointer-events-none"><div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[620px] h-[620px] rounded-full bg-indigo-500/10 blur-3xl"></div></div>
<main class="card relative w-full max-w-xl rounded-[30px] p-6 sm:p-8 overflow-hidden">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-56 h-px bg-gradient-to-r from-transparent via-indigo-400 to-transparent pulse-line"></div>
<header class="text-center mb-7">
<div class="mx-auto mb-4 w-16 h-16 rounded-2xl flex items-center justify-center bg-indigo-500/10 border border-indigo-400/30 shadow-inner shadow-indigo-500/20">
<svg class="w-9 h-9 text-indigo-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v5c0 4.5-2.9 8.6-7 10-4.1-1.4-7-5.5-7-10V6l7-3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4"/></svg>
</div>
<h1 class="text-3xl font-extrabold tracking-tight">Z NEXUS</h1>
<p class="text-[11px] tracking-[.28em] uppercase text-indigo-300/80 mt-1">Secure Key Gateway · 2026</p>
<div class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-emerald-400/20 bg-emerald-400/5 text-emerald-300 text-[11px] font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-300"></span> SECURE · HWID LOCKED</div>
</header>
<div id="device-card" class="mb-5 p-4 rounded-2xl bg-black/20 border border-white/5">
<div class="flex items-center justify-between gap-3"><div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Dispositivo</p><p id="hwid-display" class="font-mono text-xs text-indigo-300 mt-1 break-all">Detectando...</p></div><div class="text-right"><p class="text-[10px] text-gray-500 uppercase tracking-wider">Protección</p><p class="text-xs text-gray-300 mt-1">1 key · 1 HWID</p></div></div>
</div>
<div id="app-container" class="in"><div class="py-14 text-center"><div class="w-8 h-8 mx-auto border-2 border-indigo-300/30 border-t-indigo-300 rounded-full animate-spin"></div><p class="text-sm text-gray-400 mt-4">Conectando con el gateway...</p></div></div>
<div class="mt-7 grid grid-cols-3 gap-2 text-center text-[10px] text-gray-500"><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">KEY UNIQUE</div><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">HWID BOUND</div><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">ANTI SHARE</div></div>
<footer class="mt-5 text-center text-[10px] text-gray-600">Z NEXUS · Las keys nuevas no se comparten entre dispositivos.</footer>
</main>
<script type="module">
const container=document.getElementById('app-container'),hwidDisplay=document.getElementById('hwid-display');
const API_BASE='';
const linkRequirements={6:1,12:2,24:3,30:4};
const KEY_RE=/^FREE_[A-Z]{10}-[0-9]{4}$/;
const SESSION_KEY='znexus_server_session_v6',ACTIVE_KEY='znexus_active_key_v4',ACTIVE_EXPIRES='znexus_expires_at_v4';
let deviceId='',timerInterval=null,isGeneratingKey=false,verifyInFlight=false,initDone=false,apiHealthy=false;
function msg(v,f='Error desconocido.'){if(typeof v==='string'&&v.trim())return v;if(v&&typeof v==='object'){if(typeof v.message==='string'&&v.message.trim())return v.message;if(typeof v.error==='string'&&v.error.trim())return v.error;try{return JSON.stringify(v)}catch{}}return f}
async function api(path,o={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),o.timeout||10000);try{const r=await fetch(API_BASE+path,{method:o.method||'GET',body:o.body,signal:c.signal,cache:'no-store',credentials:'omit',headers:{Accept:'application/json',...(o.body?{'Content-Type':'application/json'}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(msg(d,`HTTP ${r.status}`));return d}catch(e){if(e.name==='AbortError')throw new Error('TIMEOUT');throw e}finally{clearTimeout(t)}}
function validDevice(v){return /^HWID-[A-Z0-9]{24}$/.test(String(v||''))}
async function hwid(){
const supplied=new URLSearchParams(location.search).get('hwid');if(validDevice(supplied))return supplied;
try{const saved=localStorage.getItem('znexus_device_id_v1');if(validDevice(saved))return saved}catch{}
const a=[navigator.hardwareConcurrency||'unknown',navigator.deviceMemory||'unknown',navigator.platform||'unknown',`${screen.width}x${screen.height}x${screen.colorDepth}`,Intl.DateTimeFormat().resolvedOptions().timeZone||'unknown',navigator.language||'unknown',navigator.maxTouchPoints||0];
try{const x=document.createElement('canvas'),g=x.getContext('webgl')||x.getContext('experimental-webgl'),d=g&&g.getExtension('WEBGL_debug_renderer_info');if(d)a.push(g.getParameter(d.UNMASKED_VENDOR_WEBGL),g.getParameter(d.UNMASKED_RENDERER_WEBGL))}catch{}
const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(a.join('|'))),id='HWID-'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24).toUpperCase();try{localStorage.setItem('znexus_device_id_v1',id)}catch{}return id}
function getSession(){try{const x=localStorage.getItem(SESSION_KEY);return x?JSON.parse(x):null}catch{return null}}function setSession(s){try{localStorage.setItem(SESSION_KEY,JSON.stringify(s))}catch{}}function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch{}}
function saveKey(k,e){try{localStorage.setItem(ACTIVE_KEY,k);localStorage.setItem(ACTIVE_EXPIRES,String(e))}catch{}}function readKey(){try{const k=localStorage.getItem(ACTIVE_KEY),e=Number(localStorage.getItem(ACTIVE_EXPIRES)||0);return KEY_RE.test(k||'')&&e>Date.now()?{k,exp:e}:null}catch{return null}}
function clearKey(){try{localStorage.removeItem(ACTIVE_KEY);localStorage.removeItem(ACTIVE_EXPIRES)}catch{}if(timerInterval)clearTimeout(timerInterval);timerInterval=null}
function error(text,retry=true,action=null,label='Reintentar'){const s=msg(text).replace(/[<>]/g,'');container.innerHTML=`<div class="in p-5 rounded-2xl border border-red-400/20 bg-red-400/5 text-center"><p class="text-red-300 text-sm font-bold">${s}</p><button id="err" class="btn mt-4 w-full py-3 rounded-xl bg-red-500/15 border border-red-400/20 text-red-200 font-semibold text-sm">${retry?label:'Volver al inicio'}</button></div>`;document.getElementById('err').onclick=()=>{if(action)return action();if(!retry){clearSession();clearKey()}location.href=location.origin}}
function start(){container.innerHTML=`<div class="in"><p class="text-gray-300 text-sm text-center">Elige la duración de tu acceso.</p><div class="grid grid-cols-2 gap-3 mt-4">${[6,12,24,30].map(h=>`<button data-h="${h}" class="dur rounded-2xl p-4 text-left border border-white/10 bg-white/[.025]"><div class="flex items-center justify-between"><span class="text-lg font-bold">${h}h</span><span class="text-[10px] text-indigo-300 uppercase">Access</span></div><p class="text-xs text-gray-500 mt-1">${linkRequirements[h]} acceso${linkRequirements[h]>1?'s':''}</p></button>`).join('')}</div><div class="mt-5 p-4 rounded-2xl bg-indigo-500/5 border border-indigo-400/10"><p class="text-xs text-gray-300 font-semibold">Nueva protección</p><p class="text-[11px] text-gray-500 mt-1">Cada key se genera aleatoriamente y se ata al HWID que la recibe.</p></div></div>`;document.querySelectorAll('.dur').forEach(b=>b.onclick=()=>begin(Number(b.dataset.h)))}
async function begin(hours){try{container.innerHTML='<div class="py-14 text-center text-indigo-300 animate-pulse">Preparando acceso seguro...</div>';const d=await api('/api/session/start',{method:'POST',body:JSON.stringify({hours,deviceId})});setSession(d.session);progress(d.session)}catch(e){error(e)}}
async function prepare(){try{const s=getSession();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/session/prepare-link',{method:'POST',body:JSON.stringify({sessionId:s.id,link:s.link,deviceId})});setSession(d.session);location.href=d.redirectUrl}catch(e){error(e)}}
function progress(s){const total=linkRequirements[s.dur]||1;const done=Number(s.completedLinks||0),pct=Math.min(100,Math.round(done/total*100));if(s.state==='awaiting_external_return'){container.innerHTML=`<div class="in text-center p-5 rounded-2xl border border-amber-400/15 bg-amber-400/5"><p class="text-amber-200 text-sm font-bold">Esperando confirmación</p><p class="text-gray-500 text-xs mt-2">Regresa desde Linkvertise para validar este paso.</p><div class="mt-4 h-2 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-indigo-500 rounded-full" style="width:${pct}%"></div></div></div>`;return}container.innerHTML=`<div class="in"><div class="flex items-center justify-between text-xs"><span class="text-gray-300">Paso ${Math.min(Number(s.link||1),total)} de ${total}</span><span class="text-indigo-300">${pct}%</span></div><div class="mt-2 h-2 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-indigo-500 rounded-full transition-all" style="width:${pct}%"></div></div><button id="go" class="btn mt-5 w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">Continuar al acceso</button></div>`;document.getElementById('go').onclick=prepare}
function returnScreen(){container.innerHTML='<div class="in py-12 text-center"><div class="w-8 h-8 mx-auto border-2 border-indigo-300/30 border-t-indigo-300 rounded-full animate-spin"></div><p class="text-gray-300 text-sm mt-4">Verificando comprobante...</p><p class="text-gray-500 text-xs mt-1">No cierres esta pestaña.</p></div>'}
async function verifyReturn(){if(verifyInFlight)return;const p=new URLSearchParams(location.search),hash=p.get('hash');if(!hash){const s=getSession();if(s&&s.state==='awaiting_external_return')return progress(s);return load()}verifyInFlight=true;returnScreen();try{const s=getSession();if(!s)throw new Error('La sesión ya no está disponible.');if(!/^[A-Za-z0-9]{64}$/.test(hash))throw new Error('Comprobante inválido.');const d=await api('/api/linkvertise/verify',{method:'POST',timeout:15000,body:JSON.stringify({sessionId:s.id,link:s.link,hash,deviceId})});setSession(d.session);history.replaceState({},document.title,location.pathname);if(d.session.state==='complete')await generate();else progress(d.session)}catch(e){error(e,true,()=>{clearSession();location.href=location.origin},'Volver a empezar')}finally{verifyInFlight=false}}
async function load(){const s=getSession();if(!s)return start();try{const d=await api(`/api/session/get?sessionId=${encodeURIComponent(s.id)}&deviceId=${encodeURIComponent(deviceId)}`);setSession(d.session);if(d.session.state==='complete')ready();else progress(d.session)}catch{clearSession();start()}}
function ready(){container.innerHTML='<div class="in p-5 rounded-2xl border border-emerald-400/15 bg-emerald-400/5 text-center"><p class="text-emerald-300 text-sm font-bold">Verificación completada</p><p class="text-gray-500 text-xs mt-1">La key quedará protegida por HWID.</p><button id="gen" class="btn mt-4 w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">Generar mi key</button></div>';document.getElementById('gen').onclick=generate}
async function generate(){if(isGeneratingKey)return;isGeneratingKey=true;try{const s=getSession();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/key/generate',{method:'POST',body:JSON.stringify({sessionId:s.id,deviceId})});clearSession();showKey(d.key,Number(d.expiresAt))}catch(e){error(e,false)}finally{isGeneratingKey=false}}
async function copyKey(){const k=readKey()?.k||'';try{await navigator.clipboard.writeText(k);const b=document.getElementById('copy');if(b){b.textContent='Copiada ✓';setTimeout(()=>b.textContent='Copiar key',1400)}}catch{}}
function showKey(k,exp){if(timerInterval)clearTimeout(timerInterval);saveKey(k,exp);container.innerHTML=`<div class="in space-y-4"><div class="p-5 rounded-2xl border border-indigo-400/20 bg-indigo-500/5"><div class="flex items-center justify-between"><span class="text-xs text-indigo-300 font-semibold">KEY ACTIVA</span><span class="text-[10px] text-emerald-300">HWID PROTECTED</span></div><p class="mt-3 font-mono text-lg sm:text-xl tracking-wide break-all">${k}</p><button id="copy" class="btn mt-4 w-full py-3 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold">Copiar key</button></div><div class="grid grid-cols-2 gap-3"><div class="p-4 rounded-2xl border border-white/5 bg-white/[.025]"><p class="text-[10px] text-gray-500 uppercase">Formato</p><p class="text-xs text-gray-300 mt-1">FREE_XXXXXXXXXX-0000</p></div><div class="p-4 rounded-2xl border border-white/5 bg-white/[.025]"><p class="text-[10px] text-gray-500 uppercase">Binding</p><p class="text-xs text-gray-300 mt-1">1 key / 1 HWID</p></div></div><p id="cd" class="text-center text-gray-400 text-xs"></p></div>`;document.getElementById('copy').onclick=copyKey;const tick=()=>{const x=Math.max(0,exp-Date.now());if(!x){clearKey();return error('La key expiró.',false)}const h=Math.floor(x/36e5),m=Math.floor(x%36e5/6e4),s=Math.floor(x%6e4/1e3),cd=document.getElementById('cd');if(cd)cd.textContent=`Expira en ${h}h ${m}m ${s}s`;timerInterval=setTimeout(tick,1000)};tick()}
async function recoverKey(){try{const d=await api(`/api/key/recover?deviceId=${encodeURIComponent(deviceId)}`,{timeout:8000});if(d.found){showKey(d.key,Number(d.expiresAt));return true}clearKey();return false}catch{const c=readKey();if(c){showKey(c.k,c.exp);return true}return false}}
async function init(){try{deviceId=await hwid();hwidDisplay.textContent=deviceId;const p=new URLSearchParams(location.search);if(p.has('hash')){await verifyReturn();apiHealthy=true;initDone=true;return}const h=await api('/api/health',{timeout:7000});if(!h.ok)throw new Error('Gateway no disponible.');apiHealthy=true;if(await recoverKey()){initDone=true;return}await load();initDone=true}catch(e){apiHealthy=false;initDone=true;error(e)}}
window.addEventListener('pageshow',async()=>{if(!initDone||!apiHealthy||new URLSearchParams(location.search).has('hash')||isGeneratingKey||verifyInFlight)return;await recoverKey()});
window.addEventListener('online',async()=>{if(initDone&&apiHealthy)await recoverKey()});
init();
</script>
</body>
</html>
