<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Z nexus · Key system</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#050508;color:#fff;font-family:Inter,system-ui,sans-serif}.card{width:100%;max-width:560px;background:linear-gradient(145deg,#171724,#09090f);border:1px solid #292941;border-radius:30px;padding:32px;box-shadow:0 30px 100px #0008}.top{text-align:center;margin-bottom:24px}.icon{font-size:30px}.title{font-size:30px;font-weight:800;margin:8px 0}.sub{font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:#a5b4fc}.online{display:inline-block;margin-top:14px;padding:7px 12px;border-radius:999px;border:1px solid #34d39933;color:#6ee7b7;font-size:11px;font-weight:700}.device{display:flex;justify-content:space-between;padding:16px;border-radius:18px;background:#0003;border:1px solid #ffffff0d;margin-bottom:20px}.label{font-size:10px;color:#71717a;text-transform:uppercase}.value{margin-top:5px;font-size:12px}.mono{font-family:ui-monospace,monospace}.right{text-align:right}.plans{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.btn{width:100%;padding:15px;border-radius:16px;border:1px solid #ffffff1a;background:#ffffff06;color:#fff;text-align:left;cursor:pointer}.btn:hover{border-color:#818cf866}.hours{font-size:18px;font-weight:800}.ads{float:right;font-size:10px;color:#a5b4fc}.muted{font-size:12px;color:#71717a;margin-top:5px}.box,.human,.key,.error{padding:20px;border-radius:18px}.box,.human,.key{border:1px solid #818cf826;background:#6366f10d}.action{margin-top:18px;width:100%;padding:14px;border:0;border-radius:14px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}.error{border:1px solid #f8717133;background:#f871710d;color:#fca5a5}.turnstile{display:flex;justify-content:center;margin-top:18px;min-height:65px}.status{font-size:11px;color:#71717a;margin-top:12px}.keycode{margin-top:12px;padding:15px;border-radius:12px;background:#0005;border:1px solid #ffffff12;font-size:18px;text-align:center;word-break:break-all}.copy{margin-top:12px;width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff1a;background:#ffffff08;color:#fff;cursor:pointer}@media(max-width:500px){.card{padding:22px}.plans{grid-template-columns:1fr}.device{display:block}.right{text-align:left;margin-top:12px}}</style></head><body><main class="card"><header class="top"><div class="icon">🛡️</div><h1 class="title">Key System</h1><div class="sub">Z nexus · Key system 2026</div><div class="online">● Key system online</div></header><div class="device"><div><div class="label">Dispositivo</div><div id="hwid" class="value mono">Detectando...</div></div><div class="right"><div class="label">Estado key</div><div id="key-state" class="value">Comprobando...</div></div></div><div id="app">Cargando...</div></main><script>const C=document.getElementById('app'),D=document.getElementById('hwid'),KS=document.getElementById('key-state'),REQ={6:1,12:2,24:3,30:4},KEY=/^FREE_[A-Z]{9}-[0-9]{4}$/,SK='znexus_server_session_v8',AK='znexus_active_key_v6',AE='znexus_expires_at_v6';let deviceId='',inFlight=null,tsLoad=null,tsWidget=null,working=false,recoverTimer=null;const get=()=>{try{return JSON.parse(localStorage.getItem(SK)||'null')}catch{return null}},save=s=>{try{localStorage.setItem(SK,JSON.stringify(s))}catch{}},clear=()=>{try{localStorage.removeItem(SK)}catch{}},err=x=>String(x?.error||x?.message||x||'Error desconocido.');async function api(p,o={}){const r=await fetch(p,{method:o.method||'GET',body:o.body,credentials:'include',cache:'no-store',headers:{Accept:'application/json',...(o.body?{'Content-Type':'application/json'}:{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(err(d));return d}function stopRecover(){if(recoverTimer)clearInterval(recoverTimer);recoverTimer=null}function error(x){stopRecover();KS.textContent='Error';KS.style.color='#fca5a5';C.innerHTML='<div class="error"><b>'+err(x).replace(/[<>]/g,'')+'</b><button class="action" id="r">Reintentar</button></div>';document.getElementById('r').onclick=()=>location.reload()}function start(){KS.textContent='Sin key';C.innerHTML='<div>Elige la duración de tu acceso.<div class="plans">'+[6,12,24,30].map(h=>'<button class="btn" data-h="'+h+'"><span class="hours">'+h+'h</span><span class="ads">'+REQ[h]+' ADS</span><div class="muted">Key única y protegida</div></button>').join('')+'</div><div class="box" style="margin-top:18px"><b>Protección anti-bypass</b><div class="muted">Ticket único, HWID y verificación humana al final.</div></div></div>';document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>begin(+b.dataset.h))}async function begin(hours){stopRecover();try{const d=await api('/api/session/start',{method:'POST',body:JSON.stringify({hours,deviceId})});save(d.session);progress(d.session)}catch(e){error(e)}}async function go(){const s=get();if(!s)return error('La sesión ya no está disponible.');try{const d=await api('/api/session/prepare-link',{method:'POST',body:JSON.stringify({sessionId:s.id,link:s.link,deviceId})});save(d.session);location.href=d.redirectUrl}catch(e){error(e)}}function progress(s){stopRecover();const total=REQ[+s.dur],done=+s.completedLinks||0,step=Math.min(+s.link||1,total);KS.textContent='Procesando';KS.style.color='#a5b4fc';C.innerHTML='<div><div style="display:flex;justify-content:space-between;font-size:12px"><span>Anuncio '+step+' de '+total+'</span><span>'+Math.round(done/total*100)+'%</span></div><div style="height:10px;background:#ffffff0d;border-radius:99px;margin-top:10px;overflow:hidden"><div style="height:100%;width:'+Math.min(100,done/total*100)+'%;background:#6366f1"></div></div><div class="muted" style="text-align:center">'+(done>=total?'Anuncios completados.':'Cada plan tiene su número de anuncios asignado.')+'</div><button class="action" id="go">'+(done>=total?'Continuar':'Ir al anuncio '+step)+'</button></div>';document.getElementById('go').onclick=go}function loadTS(){if(tsLoad)return tsLoad;tsLoad=new Promise((res,rej)=>{if(window.turnstile)return res();const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;s.defer=true;s.onload=()=>window.turnstile?res():rej(Error('No se pudo cargar Turnstile.'));s.onerror=()=>rej(Error('No se pudo cargar Turnstile.'));document.head.appendChild(s)});return tsLoad}function cleanTS(){if(tsWidget!==null&&window.turnstile){try{window.turnstile.remove(tsWidget)}catch{}}tsWidget=null}async function human(hash){if(inFlight)return inFlight;stopRecover();inFlight=(async()=>{C.innerHTML='<div class="human"><b>Verifica que eres humano</b><div class="muted">Esta comprobación es necesaria antes de entregar la key.</div><div id="ts" class="turnstile"></div><div id="st" class="status">Esperando verificación...</div></div>';await loadTS();const cfg=await api('/api/turnstile/config',{timeout:7000});if(!cfg.siteKey)throw Error('La verificación humana no está configurada.');await new Promise((resolve,reject)=>{let done=false;const st=t=>{const e=document.getElementById('st');if(e)e.textContent=t};tsWidget=window.turnstile.render('#ts',{sitekey:cfg.siteKey,theme:'dark',action:'keyverify',callback:async token=>{if(done)return;done=true;st('Verificando con el servidor...');try{await verifyReturn(hash,token);cleanTS();resolve()}catch(e){st(err(e));try{window.turnstile.reset(tsWidget)}catch{}reject(e)}},'error-callback':()=>{if(done)return;done=true;reject(Error('No se pudo completar la verificación humana.'))},'expired-callback':()=>st('La verificación expiró. Repite la comprobación.')});if(tsWidget===undefined||tsWidget===null)reject(Error('Turnstile no pudo iniciarse.'))})})().finally(()=>inFlight=null);return inFlight}async function verifyReturn(hash,token=''){if(inFlight&&token)return inFlight;const s=get();if(!s)throw Error('La sesión ya no está disponible.');const total=REQ[+s.dur]||0;if(!total)throw Error('Duración de sesión inválida.');if(+s.link===total&&!token)return human(hash);const p=api('/api/linkvertise/verify',{method:'POST',timeout:20000,body:JSON.stringify({sessionId:s.id,link:s.link,hash,deviceId,turnstileToken:token})});inFlight=p;try{const d=await p;save(d.session);history.replaceState({},document.title,location.pathname);if(d.session.state==='complete')await generate();else progress(d.session)}finally{inFlight=null}}async function generate(){if(working)return;working=true;stopRecover();try{const s=get();if(!s)throw Error('La sesión ya no está disponible.');const d=await api('/api/key/generate',{method:'POST',body:JSON.stringify({sessionId:s.id,deviceId})});clear();showKey(d.key,+d.expiresAt)}catch(e){error(e)}finally{working=false}}function showKey(k,e){if(!KEY.test(String(k||'')))return error('El servidor devolvió una key con formato inválido.');if(e<=Date.now())return error('La key ya expiró.');KS.textContent='ACTIVA';KS.style.color='#6ee7b7';try{localStorage.setItem(AK,k);localStorage.setItem(AE,String(e))}catch{}C.innerHTML='<div class="key"><b style="color:#a5b4fc">KEY ACTIVA</b><div class="keycode mono">'+k+'</div><button class="copy" id="copy">Copiar key</button><div id="ex" class="muted"></div></div>';document.getElementById('copy').onclick=()=>navigator.clipboard?.writeText(k);const tick=()=>{const left=Math.max(0,e-Date.now()),s=Math.floor(left/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),z=s%60,el=document.getElementById('ex');if(el)el.textContent='Expira en '+h+'h '+m+'m '+z+'s';if(!left){clearInterval(iv);try{localStorage.removeItem(AK);localStorage.removeItem(AE)}catch{}start()}};tick();const iv=setInterval(tick,1000)}async function recover(){if(get()||inFlight)return;try{const d=await api('/api/key/recover?deviceId='+encodeURIComponent(deviceId),{timeout:8000});if(d.found&&KEY.test(String(d.key||''))){showKey(d.key,+d.expiresAt);stopRecover()}}catch{}}async function init(){try{const q=new URLSearchParams(location.search);const qh=q.get('hwid');deviceId=/^HWID-[A-Z0-9]{24}$/.test(qh||'')?qh:await getDevice();D.textContent=deviceId;const ck=localStorage.getItem(AK),ce=+localStorage.getItem(AE)||0;if(KEY.test(ck||'')&&ce>Date.now())return showKey(ck,ce);const s=get();if(s){try{const d=await api('/api/session/get?sessionId='+encodeURIComponent(s.id)+'&deviceId='+encodeURIComponent(deviceId));save(d.session);const hash=q.get('hash');if(hash&&/^[A-Za-z0-9]{64}$/.test(hash))return await verifyReturn(hash);if(d.session.state==='complete')return await generate();return progress(d.session)}catch{clear()}}const hash=q.get('hash');if(hash)return error('La sesión de verificación ya no está disponible.');await recover();if(!get())start();recoverTimer=setInterval(()=>recover(),5000)}catch(e){error(e)}}async function getDevice(){try{const x=localStorage.getItem('znexus_device_id_v1');if(/^HWID-[A-Z0-9]{24}$/.test(x||''))return x}catch{}const a=[navigator.hardwareConcurrency||'u',navigator.platform||'u',screen.width+'x'+screen.height,navigator.language||'u',Intl.DateTimeFormat().resolvedOptions().timeZone||'u'];const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(a.join('|'))),id='HWID-'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24).toUpperCase();try{localStorage.setItem('znexus_device_id_v1',id)}catch{}return id}init();</script></body></html>
