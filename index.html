<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Z NEXUS — Secure Key Gateway</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:'Plus Jakarta Sans',sans-serif;background:#050508;-webkit-user-select:none;user-select:none}.card{background:linear-gradient(145deg,rgba(23,23,36,.97),rgba(9,9,15,.98));border:1px solid #292941;box-shadow:0 30px 100px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.05)}.btn{transition:.18s}.btn:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(99,102,241,.28)}.btn:active{transform:scale(.98)}.dur{transition:.18s}.dur:hover{transform:translateY(-2px);border-color:#6366f1;background:rgba(99,102,241,.1)}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.in{animation:in .28s ease both}</style><script>document.addEventListener('contextmenu',e=>e.preventDefault(),false)</script></head><body class="min-h-screen text-white flex items-center justify-center px-4 py-8"><div class="fixed inset-0 pointer-events-none"><div class="absolute -top-48 left-1/2 -translate-x-1/2 w-[620px] h-[620px] rounded-full bg-indigo-500/10 blur-3xl"></div></div><main class="card relative w-full max-w-xl rounded-[30px] p-6 sm:p-8 overflow-hidden"><div class="absolute top-0 left-1/2 -translate-x-1/2 w-56 h-px bg-gradient-to-r from-transparent via-indigo-400 to-transparent"></div><header class="text-center mb-6"><div class="mx-auto mb-4 w-16 h-16 rounded-2xl flex items-center justify-center bg-indigo-500/10 border border-indigo-400/30"><svg class="w-9 h-9 text-indigo-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v5c0 4.5-2.9 8.6-7 10-4.1-1.4-7-5.5-7-10V6l7-3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4"/></svg></div><h1 class="text-3xl font-extrabold tracking-tight">Z NEXUS</h1><p class="text-[11px] tracking-[.28em] uppercase text-indigo-300/80 mt-1">Secure Key Gateway · 2026</p><div class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-emerald-400/20 bg-emerald-400/5 text-emerald-300 text-[11px] font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-300"></span> SECURE · HWID LOCKED</div></header><div class="mb-5 p-4 rounded-2xl bg-black/20 border border-white/5"><div class="flex items-center justify-between gap-4"><div><p class="text-[10px] text-gray-500 uppercase tracking-wider">Dispositivo</p><p id="hwid-display" class="font-mono text-xs text-indigo-300 mt-1 break-all">Detectando...</p></div><div class="text-right"><p class="text-[10px] text-gray-500 uppercase tracking-wider">Protección</p><p class="text-xs text-gray-300 mt-1">1 key · 1 HWID</p></div></div></div><div id="app-container"><div class="py-14 text-center"><div class="w-8 h-8 mx-auto border-2 border-indigo-300/30 border-t-indigo-300 rounded-full animate-spin"></div><p class="text-sm text-gray-400 mt-4">Conectando con el gateway...</p></div></div><div class="mt-7 grid grid-cols-3 gap-2 text-center text-[10px] text-gray-500"><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">KEY UNIQUE</div><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">HWID BOUND</div><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">ANTI SHARE</div></div><footer class="mt-5 text-center text-[10px] text-gray-600">Z NEXUS · Las keys nuevas no se comparten entre dispositivos.</footer></main><script type="module">
const C=document.getElementById('app-container'),D=document.getElementById('hwid-display'),API='',REQ={6:1,12:2,24:3,30:4},KEY_RE=/^FREE_[A-Z]{9}-[0-9]{4}$/,SESSION='znexus_server_session_v7',AK='znexus_active_key_v5',AE='znexus_expires_at_v5';let deviceId='',timer=null,working=false,verifying=false,readyFlag=false,healthy=false;
function errText(v,f='Error desconocido.'){if(typeof v==='string'&&v.trim())return v;if(v&&typeof v==='object'){if(v.error)return String(v.error);if(v.message)return String(v.message)}return f}
async function api(path,o={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),o.timeout||10000);try{const r=await fetch(API+path,{method:o.method||'GET',body:o.body,signal:c.signal,cache:'no-store',credentials:'omit',headers:{Accept:'application/json',...(o.body?{'Content-Type':'application/json'}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(errText(d,`HTTP ${r.status}`));return d}catch(e){if(e.name==='AbortError')throw new Error('TIMEOUT');throw e}finally{clearTimeout(t)}}
function validHw(v){return /^HWID-[A-Z0-9]{24}$/.test(String(v||''))}
async function getHw(){const q=new URLSearchParams(location.search),sup=q.get('hwid');if(validHw(sup))return sup;try{const old=localStorage.getItem('znexus_device_id_v1');if(validHw(old))return old}catch{}const a=[navigator.hardwareConcurrency||'u',navigator.deviceMemory||'u',navigator.platform||'u',`${screen.width}x${screen.height}x${screen.colorDepth}`,Intl.DateTimeFormat().resolvedOptions().timeZone||'u',navigator.language||'u',navigator.maxTouchPoints||0];try{const x=document.createElement('canvas'),g=x.getContext('webgl')||x.getContext('experimental-webgl'),i=g&&g.getExtension('WEBGL_debug_renderer_info');if(i)a.push(g.getParameter(i.UNMASKED_VENDOR_WEBGL),g.getParameter(i.UNMASKED_RENDERER_WEBGL))}catch{}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(a.join('|'))),id='HWID-'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24).toUpperCase();try{localStorage.setItem('znexus_device_id_v1',id)}catch{}return id}
function gs(){try{const s=localStorage.getItem(SESSION);return s?JSON.parse(s):null}catch{return null}}function ss(s){try{localStorage.setItem(SESSION,JSON.stringify(s))}catch{}}function cs(){try{localStorage.removeItem(SESSION)}catch{}}function sk(k,e){try{localStorage.setItem(AK,k);localStorage.setItem(AE,String(e))}catch{}}function rk(){try{const k=localStorage.getItem(AK),e=Number(localStorage.getItem(AE)||0);return KEY_RE.test(k||'')&&e>Date.now()?{k,exp:e}:null}catch{return null}}function ck(){try{localStorage.removeItem(AK);localStorage.removeItem(AE)}catch{}if(timer)clearTimeout(timer);timer=null}
function showError(v,retry=true){C.innerHTML=`<div class="in p-5 rounded-2xl border border-red-400/20 bg-red-400/5 text-center"><p class="text-red-300 text-sm font-bold">${errText(v).replace(/[<>]/g,'')}</p><button id="e" class="btn mt-4 w-full py-3 rounded-xl bg-red-500/15 border border-red-400/20 text-red-200 font-semibold text-sm">${retry?'Reintentar':'Volver al inicio'}</button></div>`;document.getElementById('e').onclick=()=>{if(!retry){cs();ck()}location.href=location.origin}}
function start(){C.innerHTML=`<div class="in"><p class="text-gray-300 text-sm text-center">Elige la duración de tu acceso.</p><div class="grid grid-cols-2 gap-3 mt-4">${[6,12,24,30].map(h=>`<button data-h="${h}" class="dur rounded-2xl p-4 text-left border border-white/10 bg-white/[.025]"><div class="flex justify-between"><span class="text-lg font-bold">${h}h</span><span class="text-[10px] text-indigo-300">${REQ[h]} LINK</span></div><p class="text-xs text-gray-500 mt-1">Key única y protegida</p></button>`).join('')}</div><div class="mt-5 p-4 rounded-2xl bg-indigo-500/5 border border-indigo-400/10"><p class="text-xs text-gray-300 font-semibold">Nueva seguridad</p><p class="text-[11px] text-gray-500 mt-1">La key se genera aleatoriamente, queda registrada con tu HWID y se verifica otra vez al usarla.</p></div></div>`;document.querySelectorAll('.dur').forEach(b=>b.onclick=()=>begin(Number(b.dataset.h)))}
async function begin(hours){try{C.innerHTML='<div class="py-14 text-center text-indigo-300 animate-pulse">Preparando acceso seguro...</div>';const d=await api('/api/session/start',{method:'POST',body:JSON.stringify({hours,deviceId})});ss(d.session);progress(d.session)}catch(e){showError(e)}}
async function go(){try{const s=gs();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/session/prepare-link',{method:'POST',body:JSON.stringify({sessionId:s.id,link:s.link,deviceId})});ss(d.session);location.href=d.redirectUrl}catch(e){showError(e)}}
function progress(s){const total=REQ[s.dur]||1,done=Number(s.completedLinks||0),pct=Math.min(100,Math.round(done/total*100));if(s.state==='awaiting_external_return'){C.innerHTML=`<div class="in p-5 rounded-2xl border border-amber-400/15 bg-amber-400/5 text-center"><p class="text-amber-200 text-sm font-bold">Esperando confirmación</p><p class="text-gray-500 text-xs mt-2">Regresa desde Linkvertise para validar este paso.</p><div class="mt-4 h-2 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-indigo-500" style="width:${pct}%"></div></div></div>`;return}C.innerHTML=`<div class="in"><div class="flex items-center justify-between text-xs"><span class="text-gray-300">Paso ${Math.min(Number(s.link||1),total)} de ${total}</span><span class="text-indigo-300">${pct}%</span></div><div class="mt-2 h-2 rounded-full bg-white/5 overflow-hidden"><div class="h-full bg-indigo-500" style="width:${pct}%"></div></div><button id="go" class="btn mt-5 w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">Continuar al acceso</button></div>`;document.getElementById('go').onclick=go}
function ready(){C.innerHTML='<div class="in p-5 rounded-2xl border border-emerald-400/15 bg-emerald-400/5 text-center"><p class="text-emerald-300 text-sm font-bold">Verificación completada</p><p class="text-gray-500 text-xs mt-1">Tu nueva key será bloqueada a este HWID.</p><button id="gen" class="btn mt-4 w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">Generar mi key</button></div>';document.getElementById('gen').onclick=generate}
async function generate(){if(working)return;working=true;try{const s=gs();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/key/generate',{method:'POST',body:JSON.stringify({sessionId:s.id,deviceId})});cs();showKey(d.key,Number(d.expiresAt))}catch(e){showError(e,false)}finally{working=false}}
function showKey(k,e){if(timer)clearTimeout(timer);sk(k,e);C.innerHTML=`<div class="in space-y-4"><div class="p-5 rounded-2xl border border-indigo-400/20 bg-indigo-500/5"><div class="flex justify-between"><span class="text-xs text-indigo-300 font-semibold">KEY ACTIVA</span><span class="text-[10px] text-emerald-300">HWID PROTECTED</span></div><p class="mt-3 font-mono text-lg sm:text-xl break-all">${k}</p><button id="copy" class="btn mt-4 w-full py-3 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold">Copiar key</button></div><div class="grid grid-cols-2 gap-3"><div class="p-4 rounded-2xl border border-white/5 bg-white/[.025]"><p class="text-[10px] text-gray-500 uppercase">Formato</p><p class="text-xs text-gray-300 mt-1">FREE_XXXXXXXXX-0000</p></div><div class="p-4 rounded-2xl border border-white/5 bg-white/[.025]"><p class="text-[10px] text-gray-500 uppercase">Binding</p><p class="text-xs text-gray-300 mt-1">1 key / 1 HWID</p></div></div><p id="cd" class="text-center text-gray-400 text-xs"></p></div>`;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(k);document.getElementById('copy').textContent='Copiada ✓';setTimeout(()=>document.getElementById('copy').textContent='Copiar key',1400)}catch{}};const tick=()=>{const x=Math.max(0,e-Date.now());if(!x){ck();return showError('La key expiró.',false)}const h=Math.floor(x/36e5),m=Math.floor(x%36e5/6e4),s=Math.floor(x%6e4/1e3),cd=document.getElementById('cd');if(cd)cd.textContent=`Expira en ${h}h ${m}m ${s}s`;timer=setTimeout(tick,1000)};tick()}
async function recover(){try{const d=await api(`/api/key/recover?deviceId=${encodeURIComponent(deviceId)}`,{timeout:8000});if(d.found){showKey(d.key,Number(d.expiresAt));return true}const c=rk();if(c){showKey(c.k,c.exp);return true}return false}catch{const c=rk();if(c){showKey(c.k,c.exp);return true}return false}}
async function load(){const s=gs();if(!s)return start();try{const d=await api(`/api/session/get?sessionId=${encodeURIComponent(s.id)}&deviceId=${encodeURIComponent(deviceId)}`);ss(d.session);d.session.state==='complete'?ready():progress(d.session)}catch{cs();start()}}
async function verifyReturn(){if(verifying)return;const p=new URLSearchParams(location.search),hash=p.get('hash');if(!hash)return load();verifying=true;C.innerHTML='<div class="in py-12 text-center"><div class="w-8 h-8 mx-auto border-2 border-indigo-300/30 border-t-indigo-300 rounded-full animate-spin"></div><p class="text-gray-300 text-sm mt-4">Verificando comprobante...</p></div>';try{const s=gs();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/linkvertise/verify',{method:'POST',timeout:15000,body:JSON.stringify({sessionId:s.id,link:s.link,hash,deviceId})});ss(d.session);history.replaceState({},document.title,location.pathname);d.session.state==='complete'?await generate():progress(d.session)}catch(e){showError(e,true)}finally{verifying=false}}
async function init(){try{deviceId=await getHw();D.textContent=deviceId;const p=new URLSearchParams(location.search);if(p.has('hash')){await verifyReturn();healthy=true;readyFlag=true;return}const h=await api('/api/health',{timeout:7000});if(!h.ok)throw new Error('Gateway no disponible.');healthy=true;if(await recover()){readyFlag=true;return}await load();readyFlag=true}catch(e){showError(e)}}
addEventListener('pageshow',async()=>{if(readyFlag&&healthy&&!new URLSearchParams(location.search).has('hash')&&!working&&!verifying)await recover()});addEventListener('online',async()=>{if(readyFlag&&healthy)await recover()});init();</script></body></html>
