<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Key system</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#050508;color:#fff}.card{background:linear-gradient(145deg,rgba(23,23,36,.98),rgba(9,9,15,.99));border:1px solid #292941;box-shadow:0 30px 100px rgba(0,0,0,.55)}.btn{transition:.18s}.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.985)}.progress-fill{transition:width .45s cubic-bezier(.4,0,.2,1)}
</style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">
<div class="fixed inset-0 pointer-events-none"><div class="absolute -top-52 left-1/2 -translate-x-1/2 w-[640px] h-[640px] rounded-full bg-indigo-500/10 blur-3xl"></div></div>
<main class="card relative w-full max-w-xl rounded-[30px] p-6 sm:p-8 overflow-hidden">
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-56 h-px bg-gradient-to-r from-transparent via-indigo-400 to-transparent"></div>
<header class="text-center mb-6">
<div class="mx-auto mb-4 w-16 h-16 rounded-2xl flex items-center justify-center bg-indigo-500/10 border border-indigo-400/30"><svg class="w-9 h-9 text-indigo-300" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3l7 3v5c0 4.5-2.9 8.6-7 10-4.1-1.4-7-5.5-7-10V6l7-3Z"/><path stroke-linecap="round" stroke-linejoin="round" d="m9 12 2 2 4-4"/></svg></div>
<h1 class="text-3xl font-extrabold tracking-tight">Key System</h1>
<p class="text-[11px] tracking-[.28em] uppercase text-indigo-300/80 mt-1">Z nexus · Key system 2026</p>
<div id="server-state" class="mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full border border-emerald-400/20 bg-emerald-400/5 text-emerald-300 text-[11px] font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-300"></span> Key system online</div>
</header>
<div class="mb-5 p-4 rounded-2xl bg-black/20 border border-white/5"><div class="flex items-center justify-between gap-4"><div class="min-w-0"><p class="text-[10px] text-gray-500 uppercase tracking-wider">Dispositivo</p><p id="hwid-display" class="font-mono text-xs text-indigo-300 mt-1 break-all">Detectando...</p></div><div class="text-right"><p class="text-[10px] text-gray-500 uppercase tracking-wider">Estado key</p><p id="key-state" class="text-xs text-gray-300 mt-1">Comprobando...</p></div></div></div>
<div id="app-container"><div class="py-14 text-center"><div class="w-8 h-8 mx-auto border-2 border-indigo-300/30 border-t-indigo-300 rounded-full animate-spin"></div><p class="text-sm text-gray-400 mt-4">Conectando...</p></div></div>
<div class="mt-7 grid grid-cols-3 gap-2 text-center text-[10px] text-gray-500"><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">Ads según plan</div><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">HWID</div><div class="p-3 rounded-xl border border-white/5 bg-white/[.02]">Live</div></div>
<footer class="mt-5 text-center text-[10px] text-gray-600">Z nexus · System key online 2026.</footer>
</main>
<script type="module">
const C=document.getElementById('app-container'),D=document.getElementById('hwid-display'),KS=document.getElementById('key-state'),SS=document.getElementById('server-state');
const REQUIREMENTS={6:1,12:2,24:3,30:4};
const KEY_RE=/^FREE_[A-Z]{9}-[0-9]{4}$/;
const SESSION='znexus_server_session_v8',AK='znexus_active_key_v6',AE='znexus_expires_at_v6';
let deviceId='',timer=null,serverPoll=null,working=false,verifying=false,initialized=false,progressAnim=null,turnstileLoaded=null,keyShown=false;
function text(v,f='Error desconocido.'){if(typeof v==='string'&&v.trim())return v.trim();if(v&&typeof v==='object'){if(typeof v.error==='string'&&v.error.trim())return v.error.trim();if(typeof v.message==='string'&&v.message.trim())return v.message.trim();try{const j=JSON.stringify(v);if(j&&j!=='{}')return j}catch{} }return f}
function setServer(ok){SS.innerHTML=`<span class="w-1.5 h-1.5 rounded-full ${ok?'bg-emerald-300':'bg-red-300'}"></span> ${ok?'Key system online':'Key system offline'}`;SS.className=`mt-4 inline-flex items-center gap-2 px-3 py-1.5 rounded-full border text-[11px] font-semibold ${ok?'border-emerald-400/20 bg-emerald-400/5 text-emerald-300':'border-red-400/20 bg-red-400/5 text-red-300'}`}
function setKeyState(v,c='text-gray-300'){KS.className=`text-xs mt-1 ${c}`;KS.textContent=v}
async function api(path,opt={}){const ac=new AbortController(),to=setTimeout(()=>ac.abort(),opt.timeout||10000);try{const r=await fetch(path,{method:opt.method||'GET',body:opt.body,signal:ac.signal,cache:'no-store',credentials:'include',headers:{Accept:'application/json',...(opt.body?{'Content-Type':'application/json'}:{})}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(text(d,`HTTP ${r.status}`));return d}finally{clearTimeout(to)}}
function validHw(v){return /^HWID-[A-Z0-9]{24}$/.test(String(v||''))}
async function getHw(){const q=new URLSearchParams(location.search),qhw=q.get('hwid');if(validHw(qhw)){try{localStorage.setItem('znexus_device_id_v1',qhw)}catch{}return qhw}try{const old=localStorage.getItem('znexus_device_id_v1');if(validHw(old))return old}catch{}const a=[navigator.hardwareConcurrency||'u',navigator.deviceMemory||'u',navigator.platform||'u',`${screen.width}x${screen.height}x${screen.colorDepth}`,Intl.DateTimeFormat().resolvedOptions().timeZone||'u',navigator.language||'u',navigator.maxTouchPoints||0];try{const x=document.createElement('canvas'),g=x.getContext('webgl')||x.getContext('experimental-webgl'),i=g&&g.getExtension('WEBGL_debug_renderer_info');if(i)a.push(g.getParameter(i.UNMASKED_VENDOR_WEBGL),g.getParameter(i.UNMASKED_RENDERER_WEBGL))}catch{}const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(a.join('|'))),id='HWID-'+Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,24).toUpperCase();try{localStorage.setItem('znexus_device_id_v1',id)}catch{}return id}
function gs(){try{const s=localStorage.getItem(SESSION);return s?JSON.parse(s):null}catch{return null}}
function ss(s){try{localStorage.setItem(SESSION,JSON.stringify(s))}catch{}}
function cs(){try{localStorage.removeItem(SESSION)}catch{}}
function sk(k,e){try{localStorage.setItem(AK,k);localStorage.setItem(AE,String(e))}catch{}}
function ck(){try{localStorage.removeItem(AK);localStorage.removeItem(AE)}catch{}if(timer)clearTimeout(timer);timer=null;if(progressAnim)clearInterval(progressAnim);progressAnim=null}
function cached(){try{const k=localStorage.getItem(AK),e=Number(localStorage.getItem(AE)||0);return KEY_RE.test(k||'')&&e>Date.now()?{k,exp:e}:null}catch{return null}}
function renderStart(){keyShown=false;setKeyState('Sin key','text-gray-400');C.innerHTML=`<div><p class="text-gray-300 text-sm text-center">Elige la duración de tu acceso.</p><div class="grid grid-cols-2 gap-3 mt-4">${[6,12,24,30].map(h=>`<button data-h="${h}" class="btn rounded-2xl p-4 text-left border border-white/10 bg-white/[.025] hover:border-indigo-400/40"><div class="flex justify-between"><span class="text-lg font-bold">${h}h</span><span class="text-[10px] text-indigo-300">${REQUIREMENTS[h]} ADS</span></div><p class="text-xs text-gray-500 mt-1">Key única y protegida</p></button>`).join('')}</div><div class="mt-5 p-4 rounded-2xl bg-indigo-500/5 border border-indigo-400/10"><p class="text-xs text-gray-300 font-semibold">Protección anti-bypass</p><p class="text-[11px] text-gray-500 mt-1">El servidor exige exactamente los anuncios del plan, un ticket único, HWID y verificación humana al final.</p></div></div>`;document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>begin(Number(b.dataset.h)))}
function renderError(v){setKeyState('Error','text-red-300');C.innerHTML=`<div class="p-5 rounded-2xl border border-red-400/20 bg-red-400/5 text-center"><p class="text-red-300 text-sm font-bold">${text(v).replace(/[<>]/g,'')}</p><button id="retry" class="btn mt-4 w-full py-3 rounded-xl bg-red-500/15 border border-red-400/20 text-red-200 font-semibold">Reintentar</button></div>`;document.getElementById('retry').onclick=()=>location.reload()}
async function begin(hours){try{C.innerHTML='<div class="py-14 text-center text-indigo-300 animate-pulse">Preparando acceso seguro...</div>';const d=await api('/api/session/start',{method:'POST',body:JSON.stringify({hours,deviceId})});ss(d.session);progress(d.session)}catch(e){renderError(e)}}
async function go(){try{const s=gs();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/session/prepare-link',{method:'POST',body:JSON.stringify({sessionId:s.id,link:s.link,deviceId})});ss(d.session);location.href=d.redirectUrl}catch(e){renderError(e)}}
function progress(s){if(progressAnim)clearInterval(progressAnim);const total=REQUIREMENTS[Number(s.dur)]||1,done=Math.max(0,Number(s.completedLinks)||0),step=Math.min(Number(s.link||1),total),pct=Math.min(100,Math.round(done/total*100));setKeyState(done>=total?'Completado':'Procesando','text-indigo-300');C.innerHTML=`<div><div class="flex items-center justify-between text-xs"><span class="text-gray-300">Anuncio ${step} de ${total}</span><span id="progress-percent" class="text-indigo-300 font-semibold">${pct}%</span></div><div class="mt-2 h-2.5 rounded-full bg-white/5 overflow-hidden border border-white/5"><div id="progress-fill" class="progress-fill h-full bg-indigo-500 rounded-full" style="width:${pct}%"></div></div><p id="progress-text" class="mt-2 text-[11px] text-gray-500 text-center">${done>=total?'Anuncios completados.':'Cada plan tiene su número de anuncios asignado.'}</p><button id="go" class="btn mt-5 w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">${done>=total?'Continuar':'Ir al anuncio '+step}</button></div>`;const fill=document.getElementById('progress-fill'),percent=document.getElementById('progress-percent');let visual=pct;if(done<total){const target=Math.min(94,Math.max(pct+1,Math.round(((step-1)/total)*100)+7));progressAnim=setInterval(()=>{if(visual<target){visual++;if(fill)fill.style.width=visual+'%';if(percent)percent.textContent=visual+'%'}else{clearInterval(progressAnim);progressAnim=null}},45)}document.getElementById('go').onclick=go}
function loadTurnstile(){if(turnstileLoaded)return turnstileLoaded;turnstileLoaded=new Promise((resolve,reject)=>{const done=()=>window.turnstile?resolve():reject(new Error('No se pudo cargar la verificación humana.'));if(window.turnstile)return done();const s=document.createElement('script');s.src='https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';s.async=true;s.defer=true;s.onload=()=>setTimeout(done,0);s.onerror=()=>reject(new Error('No se pudo cargar la verificación humana.'));document.head.appendChild(s)});return turnstileLoaded}
async function humanGate(hash){C.innerHTML='<div class="p-5 rounded-2xl border border-indigo-400/15 bg-indigo-500/5 text-center"><p class="text-indigo-200 text-sm font-bold">Verifica que eres humano</p><p class="text-gray-500 text-xs mt-2">Esta comprobación es necesaria antes de entregar la key.</p><div id="turnstile-box" class="mt-5 flex justify-center"></div><p id="human-status" class="mt-3 text-[11px] text-gray-500">Esperando verificación...</p></div>';await loadTurnstile();const cfg=await api('/api/turnstile/config',{timeout:7000});if(!cfg.siteKey)throw new Error('La verificación humana no está configurada.');await new Promise((resolve,reject)=>{let finished=false;const setStatus=t=>{const el=document.getElementById('human-status');if(el)el.textContent=t};let widget=null;widget=window.turnstile.render('#turnstile-box',{sitekey:cfg.siteKey,theme:'dark',action:'keyverify',callback:async token=>{if(finished)return;finished=true;setStatus('Verificando con el servidor...');try{await verifyReturn(hash,token);resolve()}catch(e){finished=false;setStatus(text(e));try{window.turnstile.reset(widget)}catch{}reject(e)}},'error-callback':()=>{setStatus('Verificación fallida. Inténtalo de nuevo.');if(!finished){finished=true;reject(new Error('No se pudo completar la verificación humana.'))}},'expired-callback':()=>{setStatus('La verificación expiró. Repite la comprobación.')}});if(widget===undefined)reject(new Error('Turnstile no pudo iniciarse.'))})}
async function verifyReturn(hash,turnstileToken=''){const s=gs();if(!s)throw new Error('La sesión ya no está disponible.');const total=REQUIREMENTS[Number(s.dur)]||0;if(!total)throw new Error('Duración de sesión inválida.');if(Number(s.link)===total&&!turnstileToken)return humanGate(hash);const d=await api('/api/linkvertise/verify',{method:'POST',timeout:20000,body:JSON.stringify({sessionId:s.id,link:s.link,hash,deviceId,turnstileToken})});ss(d.session);history.replaceState({},document.title,location.pathname);if(d.session.state==='complete')await generate();else progress(d.session)}
async function generate(){if(working)return;working=true;try{const s=gs();if(!s)throw new Error('La sesión ya no está disponible.');const d=await api('/api/key/generate',{method:'POST',body:JSON.stringify({sessionId:s.id,deviceId})});cs();showKey(d.key,Number(d.expiresAt))}catch(e){renderError(e)}finally{working=false}}
function showKey(k,e){if(!KEY_RE.test(String(k||''))){ck();return renderError('El servidor devolvió una key con formato inválido.')}if(!Number.isFinite(e)||e<=Date.now()){ck();return renderMissing('La key ya expiró.')}keyShown=true;sk(k,e);setKeyState('ACTIVA','text-emerald-300');C.innerHTML=`<div class="space-y-4"><div class="p-5 rounded-2xl border border-indigo-400/20 bg-indigo-500/5"><div class="flex justify-between"><span class="text-xs text-indigo-300 font-semibold">KEY ACTIVA</span><span class="text-[10px] text-emerald-300">HWID PROTECTED</span></div><p class="mt-3 font-mono text-lg sm:text-xl break-all">${k}</p><button id="copy" class="btn mt-4 w-full py-3 rounded-xl bg-white/5 border border-white/10 text-sm font-semibold">Copiar key</button></div><div class="grid grid-cols-2 gap-3"><div class="p-4 rounded-2xl border border-white/5 bg-white/[.025]"><p class="text-[10px] text-gray-500 uppercase">Formato</p><p class="text-xs text-gray-300 mt-1">FREE_XXXXXXXXX-0000</p></div><div class="p-4 rounded-2xl border border-white/5 bg-white/[.025]"><p class="text-[10px] text-gray-500 uppercase">Binding</p><p class="text-xs text-gray-300 mt-1">1 key / 1 HWID</p></div></div><p id="cd" class="text-center text-gray-400 text-xs"></p></div>`;document.getElementById('copy').onclick=async()=>{try{await navigator.clipboard.writeText(k);document.getElementById('copy').textContent='Copiada ✓';setTimeout(()=>{const b=document.getElementById('copy');if(b)b.textContent='Copiar key'},1400)}catch{}};const tick=()=>{const x=e-Date.now();if(x<=0){keyShown=false;ck();return renderMissing('La key expiró.')}const h=Math.floor(x/36e5),m=Math.floor(x%36e5/6e4),s=Math.floor(x%6e4/1e3),cd=document.getElementById('cd');if(cd)cd.textContent=`Expira en ${h}h ${m}m ${s}s`;timer=setTimeout(tick,1000)};tick()}
function renderMissing(msg='La key ya no existe en el servidor.'){keyShown=false;ck();setKeyState('NO EXISTE','text-red-300');C.innerHTML=`<div class="p-5 rounded-2xl border border-red-400/20 bg-red-400/5 text-center"><p class="text-red-300 text-sm font-bold">${msg}</p><p class="text-gray-500 text-xs mt-2">La base de datos ya no contiene esta key o ya expiró.</p><button id="new" class="btn mt-4 w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold">Obtener una nueva key</button></div>`;document.getElementById('new').onclick=renderStart}
async function recover(renderMissingState=false){const d=await api(`/api/key/recover?deviceId=${encodeURIComponent(deviceId)}`,{timeout:8000});setServer(true);if(d.found){showKey(String(d.key),Number(d.expiresAt));return true}if(renderMissingState)renderMissing(d.expired?'La key expiró.':'La key fue eliminada de Firebase.');return false}
async function loadSession(){const s=gs();if(!s)return renderStart();try{const d=await api(`/api/session/get?sessionId=${encodeURIComponent(s.id)}&deviceId=${encodeURIComponent(deviceId)}`);ss(d.session);d.session.state==='complete'?ready():progress(d.session)}catch{cs();renderStart()}}
function ready(){setKeyState('Listo para generar','text-emerald-300');C.innerHTML='<div class="p-5 rounded-2xl border border-emerald-400/15 bg-emerald-400/5 text-center"><p class="text-emerald-300 text-sm font-bold">Verificación completada</p><p class="text-gray-500 text-xs mt-1">Tu key quedará vinculada a este HWID.</p><button id="gen" class="btn mt-4 w-full py-3.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm">Generar mi key</button></div>';document.getElementById('gen').onclick=generate}
async function verifyHashOnLoad(){const p=new URLSearchParams(location.search),hash=p.get('hash');if(!hash)return false;await verifyReturn(hash);return true}
async function init(){try{deviceId=await getHw();D.textContent=deviceId;const h=await api('/api/health',{timeout:7000});if(!h.ok)throw new Error('Gateway no disponible.');setServer(true);if(await verifyHashOnLoad()){initialized=true;return}const hadCached=!!cached();const hadServer=await recover(false);if(hadServer){initialized=true;return}if(hadCached){renderMissing('La key ya no existe en el servidor o ya expiró.');initialized=true;return}const s=gs();if(s)await loadSession();else renderStart();initialized=true}catch(e){renderError(e)}}
function startLiveSync(){if(serverPoll)clearInterval(serverPoll);serverPoll=setInterval(async()=>{if(!initialized||working||verifying||!keyShown)return;try{await recover(true)}catch{setServer(false)}},15000)}
addEventListener('pageshow',()=>{if(initialized&&!working&&!verifying&&keyShown)recover(true).catch(()=>{})});
addEventListener('online',()=>{if(keyShown)recover(true).catch(()=>{})});
init().finally(startLiveSync);
</script>
</body>
</html>
